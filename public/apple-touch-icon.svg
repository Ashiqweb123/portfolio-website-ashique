<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b6cee;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Rounded rectangle background -->
  <rect x="0" y="0" width="180" height="180" rx="40" ry="40" fill="url(#appleGrad)"/>
  
  <!-- MRA Text -->
  <text x="90" y="110" font-family="Inter, sans-serif" font-size="48" font-weight="900" text-anchor="middle" fill="white" letter-spacing="2px" filter="url(#shadow)">MRA</text>
  
  <!-- Decorative Elements -->
  <circle cx="90" cy="50" r="8" fill="rgba(255,255,255,0.2)"/>
  <circle cx="40" cy="140" r="6" fill="rgba(255,255,255,0.15)"/>
  <circle cx="140" cy="140" r="6" fill="rgba(255,255,255,0.15)"/>
  
  <!-- Code symbol -->
  <path d="M60 70 L50 80 L60 90" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M120 70 L130 80 L120 90" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>